services:
  cp-gateway:
    build:
      context: docker/cp-gateway
    ports:
      - "5050:5050"
    volumes:
      - cp-jts:/root
    environment:
      - TZ=America/New_York
    restart: unless-stopped

  polara-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/polara.db
      - CP_GATEWAY_URL=https://cp-gateway:5050/v1/api
      - MARKET_DATA_DB_PATH=data/market_data.duckdb
      - STRATEGY_INTERVAL_SECONDS=300
      - RISK_MAX_POSITION_PCT=10
      - RISK_MAX_DAILY_LOSS_PCT=5
      - MIN_ORDER_QUANTITY=0.01
      - POSITION_SIZE_USD=120

      # ── MA Crossover ────────────────────────────────────────────────────────
      # Symbols: volatile mid/large-caps with meaningful hourly moves.
      # PLTR, COIN, SMCI, MSTR chosen for high beta and liquidity.
      - MA_SYMBOLS=PLTR,COIN,SMCI,MSTR
      # 1-hour bars: each bar captures a meaningful price move;
      # fast=5h (~half a day), slow=20h (~2.5 days) filters noise well.
      - MA_BAR_SIZE=1 hour
      - MA_FAST_PERIOD=5
      - MA_SLOW_PERIOD=20
      - MA_QUANTITY=1
      - MA_STOP_LOSS_PCT=3
      - MA_TAKE_PROFIT_PCT=8

      # ── RSI Mean-Reversion ──────────────────────────────────────────────────
      # PLTR only: 30/70 thresholds improved Sharpe from -0.17 to +0.26 vs 25/75.
      # COIN/SMCI/MSTR showed no RSI edge at any threshold tested.
      - RSI_SYMBOLS=PLTR
      - RSI_BAR_SIZE=1 hour
      - RSI_PERIOD=14
      - RSI_OVERSOLD=30
      - RSI_OVERBOUGHT=70
      - RSI_QUANTITY=1
      - RSI_STOP_LOSS_PCT=3
      - RSI_TAKE_PROFIT_PCT=8

      # ── MACD Crossover ──────────────────────────────────────────────────────
      # Classic trend-following: fast EMA(12) - slow EMA(26), signal EMA(9).
      - MACD_SYMBOLS=PLTR,COIN,SMCI,MSTR
      - MACD_BAR_SIZE=1 hour
      - MACD_FAST=12
      - MACD_SLOW=26
      - MACD_SIGNAL=9
      - MACD_QUANTITY=1
      - MACD_STOP_LOSS_PCT=3
      - MACD_TAKE_PROFIT_PCT=8

      # ── Bollinger Band Mean Reversion — hourly ──────────────────────────────
      # PLTR: BB(20, 2.5σ) hourly. Sharpe 1.90, 87% WR. Best edge found.
      - BB_SYMBOLS=PLTR
      - BB_BAR_SIZE=1 hour
      - BB_PERIOD=20
      - BB_NUM_STD=2.5
      - BB_QUANTITY=1
      - BB_STOP_LOSS_PCT=3
      - BB_TAKE_PROFIT_PCT=8

      # ── Bollinger Band Mean Reversion — daily BB(30, 2.0σ) ─────────────────
      # AM: Sharpe 1.42, 15 trades, 93% WR, PF 33. Best combo Sharpe+trades.
      # RNR: Sharpe 1.05, 13 trades, 100% WR.
      - BB_D30_SYMBOLS=AM,RNR
      - BB_D30_BAR_SIZE=1 day
      - BB_D30_PERIOD=30
      - BB_D30_NUM_STD=2.0
      - BB_D30_QUANTITY=1
      - BB_D30_STOP_LOSS_PCT=3
      - BB_D30_TAKE_PROFIT_PCT=8

      # ── Bollinger Band Mean Reversion — daily BB(15, 2.0σ) ─────────────────
      # CSL: Sharpe 0.96, 21 trades, 76% WR. Highest trade count of the group.
      - BB_D15_SYMBOLS=CSL
      - BB_D15_BAR_SIZE=1 day
      - BB_D15_PERIOD=15
      - BB_D15_NUM_STD=2.0
      - BB_D15_QUANTITY=1
      - BB_D15_STOP_LOSS_PCT=3
      - BB_D15_TAKE_PROFIT_PCT=8

      # ── Rate-of-Change Momentum ─────────────────────────────────────────────
      # Buy/sell when 14-bar ROC breaks through ±2% threshold.
      - MOM_SYMBOLS=PLTR,COIN,SMCI,MSTR
      - MOM_BAR_SIZE=1 hour
      - MOM_PERIOD=14
      - MOM_THRESHOLD=2
      - MOM_QUANTITY=1
      - MOM_STOP_LOSS_PCT=3
      - MOM_TAKE_PROFIT_PCT=8

    depends_on:
      - cp-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  cp-jts:
