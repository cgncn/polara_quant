services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    restart: unless-stopped
    environment:
      - TWS_USERID=${IB_USERNAME}
      - TWS_PASSWORD=${IB_PASSWORD}
      - TRADING_MODE=paper
      - TWS_SETTINGS_PATH=/home/ibgateway/Jts
      - TWOFA_TIMEOUT_ACTION=restart
      - TRUSTED_IPS=
      - EXISTING_SESSION_DETECTED_ACTION=primary
      # Graceful daily restart at 11:45 PM ET — before IBKR's 24h session timeout.
      # IBC re-authenticates automatically using TWS_USERID/TWS_PASSWORD.
      - AUTO_RESTART_TIME=23:45
    ports:
      - "4003:4003"
    volumes:
      - ib-jts:/home/ibgateway/Jts

  polara-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/polara.db
      - IB_HOST=ib-gateway
      - IB_PORT=4004
      - IB_CLIENT_ID=1
      - MARKET_DATA_DB_PATH=data/market_data.duckdb
      - STRATEGY_INTERVAL_SECONDS=300
      - RISK_MAX_POSITION_PCT=10
      - RISK_MAX_DAILY_LOSS_PCT=5
      - MIN_ORDER_QUANTITY=1

      # ── MA Crossover ────────────────────────────────────────────────────────
      # Symbols: volatile mid/large-caps with meaningful hourly moves.
      # PLTR, COIN, SMCI, MSTR chosen for high beta and liquidity.
      - MA_SYMBOLS=PLTR,COIN,SMCI,MSTR
      # 1-hour bars: each bar captures a meaningful price move;
      # fast=5h (~half a day), slow=20h (~2.5 days) filters noise well.
      - MA_BAR_SIZE=1 hour
      - MA_FAST_PERIOD=5
      - MA_SLOW_PERIOD=20
      - MA_QUANTITY=1
      - MA_STOP_LOSS_PCT=3
      - MA_TAKE_PROFIT_PCT=8

      # ── RSI Mean-Reversion ──────────────────────────────────────────────────
      # PLTR only: 30/70 thresholds improved Sharpe from -0.17 to +0.26 vs 25/75.
      # COIN/SMCI/MSTR showed no RSI edge at any threshold tested.
      - RSI_SYMBOLS=PLTR
      - RSI_BAR_SIZE=1 hour
      - RSI_PERIOD=14
      - RSI_OVERSOLD=30
      - RSI_OVERBOUGHT=70
      - RSI_QUANTITY=1
      - RSI_STOP_LOSS_PCT=3
      - RSI_TAKE_PROFIT_PCT=8

      # ── MACD Crossover ──────────────────────────────────────────────────────
      # Classic trend-following: fast EMA(12) - slow EMA(26), signal EMA(9).
      - MACD_SYMBOLS=PLTR,COIN,SMCI,MSTR
      - MACD_BAR_SIZE=1 hour
      - MACD_FAST=12
      - MACD_SLOW=26
      - MACD_SIGNAL=9
      - MACD_QUANTITY=1
      - MACD_STOP_LOSS_PCT=3
      - MACD_TAKE_PROFIT_PCT=8

      # ── Bollinger Band Mean Reversion ───────────────────────────────────────
      # PLTR only: BB has zero edge on COIN/SMCI/MSTR (trending/collapsing names).
      # std=2.5 upgrades Sharpe from 1.14 → 1.90 and win rate from 72% → 87%.
      - BB_SYMBOLS=PLTR
      - BB_BAR_SIZE=1 hour
      - BB_PERIOD=20
      - BB_NUM_STD=2.5
      - BB_QUANTITY=1
      - BB_STOP_LOSS_PCT=3
      - BB_TAKE_PROFIT_PCT=8

      # ── Rate-of-Change Momentum ─────────────────────────────────────────────
      # Buy/sell when 14-bar ROC breaks through ±2% threshold.
      - MOM_SYMBOLS=PLTR,COIN,SMCI,MSTR
      - MOM_BAR_SIZE=1 hour
      - MOM_PERIOD=14
      - MOM_THRESHOLD=2
      - MOM_QUANTITY=1
      - MOM_STOP_LOSS_PCT=3
      - MOM_TAKE_PROFIT_PCT=8

    depends_on:
      - ib-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  ib-jts:
