services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    restart: unless-stopped
    environment:
      - TWS_USERID=${IB_USERNAME}
      - TWS_PASSWORD=${IB_PASSWORD}
      - TRADING_MODE=paper
      - TWS_SETTINGS_PATH=/home/ibgateway/Jts
      - TWOFA_TIMEOUT_ACTION=restart
      - TRUSTED_IPS=
      - EXISTING_SESSION_DETECTED_ACTION=primary
    ports:
      - "4003:4003"
    volumes:
      - ib-jts:/home/ibgateway/Jts

  polara-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/polara.db
      - IB_HOST=ib-gateway
      - IB_PORT=4003
      - IB_CLIENT_ID=1
      - MARKET_DATA_DB_PATH=data/market_data.duckdb
      - STRATEGY_INTERVAL_SECONDS=60
      - RISK_MAX_POSITION_PCT=10
      - RISK_MAX_DAILY_LOSS_PCT=5
      - MA_STRATEGY_ID=ma-crossover-aapl
      - MA_STRATEGY_SYMBOL=AAPL
      - MA_FAST_PERIOD=10
      - MA_SLOW_PERIOD=50
      - MA_QUANTITY=1
      - MA_BAR_SIZE=5 mins
      # Phase 6 — MA bracket order percentages
      - MA_STOP_LOSS_PCT=5
      - MA_TAKE_PROFIT_PCT=10
      # Phase 5
      - MIN_ORDER_QUANTITY=1
      # RSI strategy
      - RSI_STRATEGY_ID=rsi-mean-reversion-aapl
      - RSI_STRATEGY_SYMBOL=AAPL
      - RSI_PERIOD=14
      - RSI_OVERSOLD=30
      - RSI_OVERBOUGHT=70
      - RSI_QUANTITY=1
      - RSI_BAR_SIZE=5 mins
      # Phase 6 — RSI bracket order percentages
      - RSI_STOP_LOSS_PCT=5
      - RSI_TAKE_PROFIT_PCT=10
    depends_on:
      - ib-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  ib-jts:
