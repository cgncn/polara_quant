<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polara — Strategies</title>
  <link rel="stylesheet" href="/static/dashboard/base.css">
  <style>
    /* Strategy list table */
    .strat-grid {
      display: grid;
      grid-template-columns: 18px minmax(0,2fr) 110px 72px 72px 72px 100px 36px;
      gap: 0 14px;
      align-items: center;
    }
    .strat-header-row {
      padding: 8px 18px;
      border-bottom: 1px solid var(--line);
    }
    .strat-row {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line-xs);
      cursor: pointer;
      transition: background var(--fast) var(--ease);
    }
    .strat-row:last-child { border-bottom: none; }
    .strat-row:hover { background: rgba(255,255,255,0.025); }
    .strat-row:hover .row-arrow { opacity: 1; }
    .row-arrow { opacity: 0; transition: opacity var(--fast) var(--ease); color: var(--fg-3); }

    /* Detail panel */
    .detail-overlay {
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .detail-overlay.open { display: flex; }

    /* KPI strip */
    .kpi-strip-8 {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      background: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: var(--r6);
      overflow: hidden;
    }
    .kpi-strip-8 .kpi-cell {
      padding: 14px 16px;
      border-right: 1px solid var(--line);
    }
    .kpi-strip-8 .kpi-cell:last-child { border-right: none; }
    .kpi-strip-8 .kpi-lbl { font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
    .kpi-strip-8 .kpi-val { font-family: var(--mono); font-size: 16px; }

    /* Chart wrap for equity curve */
    .equity-wrap {
      background: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: var(--r6);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .equity-wrap svg { display: block; }

    /* dot-grid background */
    .dot-grid-bg {
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 16px 16px;
      pointer-events: none;
    }

    /* Crosshair tooltip */
    .chart-tooltip {
      position: absolute;
      top: 20px;
      pointer-events: none;
      background: var(--overlay);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--line-s);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
      font-family: var(--mono);
      font-size: 11px;
      min-width: 140px;
      display: none;
    }
    @media (max-width: 800px) {
      .kpi-strip-8 { grid-template-columns: repeat(4,1fr); }
      .strat-grid  { grid-template-columns: 18px 1fr 80px 60px 60px 90px 28px; }
    }
  </style>
</head>
<body>
<div id="topbar-mount"></div>

<div class="page">
  <!-- ── Strategy list ─────────────────────────────────────────────────── -->
  <div id="list-view">
    <div class="card" style="overflow:hidden;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)">
        <div>
          <div style="font-size:15px;font-weight:500">Your strategies</div>
          <div style="font-size:12px;color:var(--fg-3);margin-top:2px" id="strat-subtitle">Loading…</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="segmented" id="mode-seg">
            <button class="active">Live</button>
            <button>Backtest</button>
          </div>
        </div>
      </div>

      <!-- header row -->
      <div class="strat-grid strat-header-row">
        <span></span>
        <span class="t-micro">Strategy</span>
        <span class="t-micro">Equity curve</span>
        <span class="t-micro" style="text-align:right">Sharpe</span>
        <span class="t-micro" style="text-align:right">Max DD</span>
        <span class="t-micro" style="text-align:right">Win %</span>
        <span class="t-micro" style="text-align:right">Net P&amp;L</span>
        <span></span>
      </div>

      <div id="strat-rows">
        <div style="padding:48px;text-align:center;color:var(--fg-4);font-family:var(--mono);font-size:12px">Loading…</div>
      </div>
    </div>

    <!-- Symbol breakdown -->
    <div class="card" style="overflow:hidden">
      <div class="table-header">
        <h2>Symbol breakdown</h2>
        <span style="font-size:11px;color:var(--fg-3)" id="sym-label">All strategies</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Symbol</th>
            <th style="text-align:right">Trades</th>
            <th style="text-align:right">Win %</th>
            <th style="text-align:right">Avg win</th>
            <th style="text-align:right">Avg loss</th>
            <th style="text-align:right">Net P&amp;L</th>
          </tr>
        </thead>
        <tbody id="sym-body">
          <tr><td colspan="6" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ── Strategy detail ───────────────────────────────────────────────── -->
  <div class="detail-overlay" id="detail-view">
    <!-- Topbar-level back is handled by a button here -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
      <button class="btn btn-ghost" id="back-btn" style="gap:6px">
        ${icon('back',14)} All strategies
      </button>
    </div>

    <!-- Equity chart card -->
    <div class="equity-wrap" id="equity-card">
      <div class="dot-grid-bg"></div>
      <div style="position:relative">
        <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:14px">
          <span style="font-family:var(--mono);font-size:36px;letter-spacing:-0.03em" id="d-pnl-display">—</span>
          <span style="font-family:var(--mono);font-size:13px" id="d-day-chg"></span>
          <span style="flex:1"></span>
          <span class="pill pill-neu" id="d-status">Live · paper</span>
        </div>
        <div id="equity-chart-wrap" style="position:relative;height:280px">
          <svg id="equity-svg" width="100%" height="280" style="display:block"></svg>
          <div class="chart-tooltip" id="chart-tooltip"></div>
        </div>
        <div style="margin-top:12px">
          <div class="segmented" id="tf-seg">
            <button class="active">1M</button>
            <button>3M</button>
            <button>YTD</button>
            <button>1Y</button>
            <button>All</button>
          </div>
        </div>
      </div>
    </div>

    <!-- KPI strip -->
    <div class="kpi-strip-8" id="d-kpi"></div>

    <!-- Trade log -->
    <div class="card" style="overflow:hidden">
      <div class="table-header">
        <h2>Recent trades</h2>
        <span style="font-size:11px;color:var(--fg-3)" id="d-trade-count"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Side</th>
            <th style="text-align:right">Qty</th>
            <th style="text-align:right">Entry</th>
            <th style="text-align:right">Exit</th>
            <th style="text-align:right">P&amp;L</th>
            <th style="text-align:right">Time</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="d-trades-body">
          <tr><td colspan="8" class="empty">Select a strategy</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="nav-mount"></div>

<script src="/static/dashboard/base.js"></script>
<script>
// Fix the back button icon (template literal issue in static HTML)
document.getElementById('back-btn').innerHTML =
  icon('back', 14) + ' All strategies';

document.getElementById('topbar-mount').innerHTML = topbar('Strategies');
document.getElementById('nav-mount').innerHTML = capsuleNav('Strategies');
init();

const SERIES_COLORS = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)'];
let strategyData = [];
let symbolData   = [];
let activeId     = null;

// ── Load data ────────────────────────────────────────────────────────────
async function loadAll() {
  [strategyData, symbolData] = await Promise.all([
    fetch('/dashboard/api/strategy/performance').then(r => r.json()),
    fetch('/dashboard/api/symbol/performance').then(r => r.json()),
  ]);
  renderStratRows();
  renderSymTable(symbolData);
  document.getElementById('strat-subtitle').textContent =
    `${strategyData.length} active · last updated ${new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })}`;
}

// ── Strategy rows ────────────────────────────────────────────────────────
function renderStratRows() {
  const el = document.getElementById('strat-rows');
  if (!strategyData.length) {
    el.innerHTML = '<div style="padding:48px;text-align:center;color:var(--fg-4);font-family:var(--mono);font-size:12px">No strategy data yet</div>';
    return;
  }
  el.innerHTML = strategyData.map((s, idx) => {
    const color  = SERIES_COLORS[idx % SERIES_COLORS.length];
    const pnl    = parseFloat(s.net_pnl || 0);
    const wr     = parseFloat(s.win_rate || 0);
    const sharpe = parseFloat(s.profit_factor || 0);  // using profit factor as proxy
    const pts    = genCurve(s.strategy_id.charCodeAt(0), 50, 100, 0.018, pnl > 0 ? 0.002 : -0.001);
    const spClr  = pnl >= 0 ? 'var(--pos)' : 'var(--neg)';

    return `<div class="strat-grid strat-row" onclick="openDetail('${s.strategy_id}')">
      <span style="width:2px;height:14px;background:${color};border-radius:1px;display:block"></span>
      <div>
        <div style="font-family:var(--mono);font-size:13px;font-weight:500">${s.strategy_id}</div>
        <div style="font-size:11px;color:var(--fg-3);margin-top:2px">${s.trade_count} closed trades</div>
      </div>
      ${sparkline(pts, { color: spClr, w: 110, h: 36, sw: 1.4 })}
      <span style="font-family:var(--mono);text-align:right;font-size:13px">${sharpe.toFixed(2)}</span>
      <span style="font-family:var(--mono);text-align:right;font-size:13px;color:var(--neg)">—</span>
      <span style="font-family:var(--mono);text-align:right;font-size:13px;color:var(--fg-2)">${wr.toFixed(0)}%</span>
      <span style="text-align:right">
        <span class="pill pill-${pnlClass(pnl)}">${fmt.pnl(pnl)}</span>
      </span>
      <span class="row-arrow" style="text-align:right">${icon('arrowUR', 13)}</span>
    </div>`;
  }).join('');
}

// ── Symbol table ─────────────────────────────────────────────────────────
function renderSymTable(rows) {
  const tbody = document.getElementById('sym-body');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No data</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const pnl = parseFloat(r.net_pnl);
    const wr  = parseFloat(r.win_rate);
    return `<tr>
      <td>
        <span style="display:inline-flex;align-items:center;gap:8px">
          ${tickerGlyph(r.symbol, 20)}
          <strong style="font-family:var(--mono)">${r.symbol}</strong>
        </span>
      </td>
      <td style="text-align:right;color:var(--fg-2)">${r.trade_count}</td>
      <td style="text-align:right;color:${wr >= 50 ? 'var(--pos)' : 'var(--neg)'}">${fmt.pct(wr)}</td>
      <td style="text-align:right;color:var(--pos)">${fmt.pnl(r.avg_win)}</td>
      <td style="text-align:right;color:var(--neg)">${fmt.pnl(r.avg_loss)}</td>
      <td style="text-align:right">
        <span class="pill pill-${pnlClass(pnl)}">${fmt.pnl(pnl)}</span>
      </td>
    </tr>`;
  }).join('');
}

// ── Detail view ──────────────────────────────────────────────────────────
async function openDetail(id) {
  activeId = id;
  document.getElementById('list-view').style.display   = 'none';
  document.getElementById('detail-view').classList.add('open');
  document.getElementById('topbar-mount').innerHTML = topbar(id);
  init(); // re-attach status polling

  const s = strategyData.find(x => x.strategy_id === id) || {};
  const pnl = parseFloat(s.net_pnl || 0);

  // PnL display
  const pnlEl = document.getElementById('d-pnl-display');
  pnlEl.textContent = fmt.pnl(pnl);
  pnlEl.style.color = pnl >= 0 ? 'var(--pos)' : pnl < 0 ? 'var(--neg)' : 'var(--fg)';
  document.getElementById('d-day-chg').textContent = '';

  // KPI strip
  const kpis = [
    ['Profit factor', parseFloat(s.profit_factor || 0).toFixed(2)],
    ['Win rate',      fmt.pct(s.win_rate || 0)],
    ['Avg win',       fmt.pnl(s.avg_win  || 0)],
    ['Avg loss',      fmt.pnl(s.avg_loss || 0)],
    ['Trades',        s.trade_count || 0],
    ['Winners',       s.win_count   || 0],
    ['Net P&L',       fmt.pnl(s.net_pnl || 0)],
    ['Status',        'Paper'],
  ];
  document.getElementById('d-kpi').innerHTML = kpis.map(([k, v]) => `
    <div class="kpi-cell">
      <div class="kpi-lbl">${k}</div>
      <div class="kpi-val">${v}</div>
    </div>`).join('');

  // Equity curve (generated from trade history)
  await drawEquityChart(id, s);

  // Trades
  const trades = await fetch(`/dashboard/api/trades?strategy=${encodeURIComponent(id)}&limit=100`).then(r => r.json());
  document.getElementById('d-trade-count').textContent = `${trades.length} trade${trades.length !== 1 ? 's' : ''}`;
  const tbody = document.getElementById('d-trades-body');
  if (!trades.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty">No trades yet</td></tr>';
    return;
  }
  tbody.innerHTML = trades.map(t => {
    const hasPnl = t.realised_pnl != null;
    return `<tr>
      <td>
        <span style="display:inline-flex;align-items:center;gap:6px">
          ${tickerGlyph(t.symbol, 18)}
          <strong style="font-family:var(--mono)">${t.symbol}</strong>
        </span>
      </td>
      <td><span class="pill ${t.side === 'buy' ? 'pill-pos' : 'pill-neg'}">${t.side.toUpperCase()}</span></td>
      <td style="text-align:right;color:var(--fg-2)">${fmt.price(t.quantity)}</td>
      <td style="text-align:right">${fmt.price(t.entry_price)}</td>
      <td style="text-align:right">${fmt.price(t.exit_price)}</td>
      <td style="text-align:right">
        ${hasPnl
          ? `<span class="pill pill-${pnlClass(t.realised_pnl)}">${fmt.pnl(t.realised_pnl)}</span>`
          : `<span class="pill pill-neu">open</span>`}
      </td>
      <td style="text-align:right;color:var(--fg-3)">${fmt.time(t.entry_at)}</td>
      <td style="text-align:right;color:var(--fg-4)">${icon('arrowUR', 12)}</td>
    </tr>`;
  }).join('');
}

async function drawEquityChart(id, s) {
  const trades = await fetch(`/dashboard/api/trades?strategy=${encodeURIComponent(id)}&limit=500`).then(r => r.json());
  const svg = document.getElementById('equity-svg');
  const W = svg.parentElement.clientWidth || 800;
  const H = 260;
  const padL = 12, padR = 60, padT = 10, padB = 28;
  const cW = W - padL - padR, cH = H - padT - padB;

  // Build cumulative PnL series from closed trades sorted by date
  const closed = trades.filter(t => t.realised_pnl != null).sort((a, b) => a.entry_at < b.entry_at ? -1 : 1);
  const pts = [{ x: 0, v: 0 }];
  let cum = 0;
  closed.forEach((t, i) => { cum += parseFloat(t.realised_pnl); pts.push({ x: i + 1, v: cum }); });

  if (pts.length < 2) {
    // No data — draw placeholder
    const fakePts = genCurve(id.charCodeAt(0), 80, 0, 0.02, parseFloat(s.net_pnl || 0) > 0 ? 0.003 : -0.002);
    const lo = Math.min(...fakePts), hi = Math.max(...fakePts), range = hi - lo || 1;
    const step = cW / (fakePts.length - 1);
    const path = fakePts.map((v, i) => {
      const x = padL + i * step;
      const y = padT + (1 - (v - lo) / range) * cH;
      return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)} ${y.toFixed(1)}`;
    }).join(' ');
    const color = parseFloat(s.net_pnl || 0) >= 0 ? 'var(--pos)' : 'var(--neg)';
    svg.setAttribute('width', W);
    svg.innerHTML = `
      <defs><pattern id="dg" x="${padL}" y="${padT}" width="16" height="16" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.6" fill="rgba(255,255,255,0.04)"/></pattern></defs>
      <rect x="${padL}" y="${padT}" width="${cW}" height="${cH}" fill="url(#dg)"/>
      <path d="${path}" stroke="${color}" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>`;
    return;
  }

  const vals = pts.map(p => p.v);
  const lo = Math.min(...vals), hi = Math.max(...vals), range = hi - lo || 1;
  const step = cW / (pts.length - 1);
  const color = vals[vals.length - 1] >= 0 ? 'var(--pos)' : 'var(--neg)';

  const pathD = pts.map((p, i) => {
    const x = padL + i * step;
    const y = padT + (1 - (p.v - lo) / range) * cH;
    return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(' ');

  const ticks = [0.15, 0.5, 0.85].map(t => lo + (1 - t) * range);
  const tickSvg = ticks.map(v => {
    const y = padT + (1 - (v - lo) / range) * cH;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${padL + cW}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.04)" stroke-dasharray="2 4"/>
            <text x="${padL + cW + 8}" y="${(y + 3).toFixed(1)}" fill="var(--fg-3)" font-size="10" font-family="Geist Mono,monospace">${v.toFixed(2)}</text>`;
  }).join('');

  svg.setAttribute('width', W);
  svg.innerHTML = `
    <defs><pattern id="dg" x="${padL}" y="${padT}" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="rgba(255,255,255,0.04)"/></pattern></defs>
    <rect x="${padL}" y="${padT}" width="${cW}" height="${cH}" fill="url(#dg)"/>
    ${tickSvg}
    <path d="${pathD}" stroke="${color}" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;

  // Crosshair on mousemove
  const wrap = document.getElementById('equity-chart-wrap');
  const tip  = document.getElementById('chart-tooltip');
  wrap.onmousemove = (e) => {
    const r  = svg.getBoundingClientRect();
    const mx = e.clientX - r.left;
    const i  = Math.round((mx - padL) / step);
    if (i < 0 || i >= pts.length) { tip.style.display = 'none'; return; }
    const p = pts[i];
    const cx = padL + i * step;
    const cy = padT + (1 - (p.v - lo) / range) * cH;

    // Remove old crosshair
    svg.querySelectorAll('.crosshair').forEach(n => n.remove());
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', cx); line.setAttribute('y1', padT);
    line.setAttribute('x2', cx); line.setAttribute('y2', padT + cH);
    line.setAttribute('stroke', 'rgba(255,255,255,0.18)');
    line.setAttribute('stroke-width', '1');
    line.classList.add('crosshair');
    svg.appendChild(line);
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', cx); dot.setAttribute('cy', cy);
    dot.setAttribute('r', '3'); dot.setAttribute('fill', color);
    dot.classList.add('crosshair');
    svg.appendChild(dot);

    tip.style.display = 'block';
    tip.style.left    = Math.min(cx + 12, W - 160) + 'px';
    tip.innerHTML     = `<div style="color:var(--fg-3);font-size:10px;margin-bottom:6px">Trade #${i}</div>
      <div style="display:flex;justify-content:space-between;gap:12px">
        <span style="color:var(--fg-2)">Cum. P&L</span>
        <span style="color:${color}">${fmt.pnl(p.v)}</span>
      </div>`;
  };
  wrap.onmouseleave = () => {
    svg.querySelectorAll('.crosshair').forEach(n => n.remove());
    tip.style.display = 'none';
  };
}

// ── Back ─────────────────────────────────────────────────────────────────
document.getElementById('back-btn').addEventListener('click', () => {
  activeId = null;
  document.getElementById('detail-view').classList.remove('open');
  document.getElementById('list-view').style.display = '';
  document.getElementById('topbar-mount').innerHTML = topbar('Strategies');
  init();
});

loadAll();
</script>
</body>
</html>
