<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polara — Strategies</title>
  <link rel="stylesheet" href="/static/dashboard/base.css">
  <style>
    .strat-header,
    .strat-row {
      display: grid;
      grid-template-columns: 20px 2fr 110px 80px 80px 72px 100px 28px;
      gap: 12px;
      align-items: center;
    }
    .strat-header {
      padding: 10px 20px;
      border-bottom: 1px solid var(--line);
    }
    .strat-row {
      padding: 15px 20px;
      border-bottom: 1px solid var(--line-soft);
      cursor: pointer;
      transition: background var(--dur-fast) var(--ease);
      color: var(--fg);
      text-decoration: none;
    }
    .strat-row:last-child { border-bottom: none; }
    .strat-row:hover { background: rgba(255,255,255,0.03); }

    .bt-header,
    .bt-row {
      display: grid;
      grid-template-columns: 2fr 90px 72px 80px 72px 90px 70px 56px 64px;
      gap: 12px;
      align-items: center;
    }
    .bt-header {
      padding: 10px 20px;
      border-bottom: 1px solid var(--line);
    }
    .bt-row {
      padding: 14px 20px;
      border-bottom: 1px solid var(--line-soft);
    }
    .bt-row:last-child { border-bottom: none; }
    @media (max-width: 900px) {
      .bt-header, .bt-row { grid-template-columns: 2fr 72px 80px 72px 56px 64px; }
      .bt-col-sharpe, .bt-col-dd, .bt-col-rr { display: none; }
    }

    .bt-controls {
      display: flex; align-items: center; gap: 8px;
    }
    .bt-controls select,
    .bt-controls input[type=number] {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--r-2);
      color: var(--fg);
      font-size: var(--t-small);
      font-family: var(--font-mono);
      padding: 5px 8px;
      height: 32px;
      outline: none;
      transition: border-color var(--dur-fast) var(--ease);
    }
    .bt-controls select:focus,
    .bt-controls input[type=number]:focus { border-color: var(--fg-3); }
    .bt-controls input[type=number] { width: 76px; }

    .run-btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 4px;
      font-size: var(--t-xs); font-family: var(--font-mono);
      padding: 4px 10px; height: 26px;
      border-radius: var(--r-2);
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--fg-2);
      cursor: pointer;
      transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
      white-space: nowrap;
    }
    .run-btn:hover { background: var(--surface-3); color: var(--fg); }
    .run-btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
    .run-btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast-stack {
      position: fixed; bottom: 24px; right: 24px;
      display: flex; flex-direction: column-reverse; gap: 8px;
      z-index: 9999; pointer-events: none;
    }
    .toast {
      background: var(--surface-3);
      border: 1px solid var(--line);
      border-radius: var(--r-2);
      padding: 10px 14px;
      font-size: var(--t-small);
      color: var(--fg);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      opacity: 0; transform: translateY(8px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: auto;
      max-width: 320px;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast.toast-ok  { border-left: 3px solid var(--pos); }
    .toast.toast-err { border-left: 3px solid var(--neg); }

    .card-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
    }

    @media (max-width: 900px) {
      .strat-header,
      .strat-row { grid-template-columns: 20px 1fr 80px 80px 28px; }
      .col-spark, .col-pf, .col-wr { display: none; }
    }
  </style>
</head>
<body>
<div id="topbar-mount"></div>

<div class="page">
  <div class="card" style="overflow:hidden">

    <div class="card-hdr">
      <div>
        <div class="t-h3" style="margin-bottom:2px">Your strategies</div>
        <div class="t-small" id="strat-sub">Loading…</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="bt-controls" id="bt-controls" style="display:none">
          <select id="bt-bar-size">
            <option value="5 mins">5 mins</option>
            <option value="15 mins">15 mins</option>
            <option value="1 hour">1 hour</option>
            <option value="1 day">1 day</option>
          </select>
          <input type="number" id="bt-lookback" value="2000" min="100" max="10000" title="Lookback bars">
          <button class="btn btn-primary" id="btn-run-all" onclick="runAllBacktests()" style="height:32px;padding:0 14px;font-size:var(--t-small)">Run All</button>
        </div>
        <div class="segmented" id="mode-toggle">
          <button aria-selected="true" data-mode="live">Live</button>
          <button data-mode="backtest">Backtest</button>
        </div>
      </div>
    </div>

    <!-- Live columns -->
    <div id="live-header" class="strat-header">
      <span></span>
      <span class="t-micro">Strategy</span>
      <span class="t-micro col-spark">Equity curve</span>
      <span class="t-micro" style="text-align:right">Profit factor</span>
      <span class="t-micro" style="text-align:right">Net P&amp;L</span>
      <span class="t-micro col-wr" style="text-align:right">Win %</span>
      <span class="t-micro" style="text-align:right">Trades</span>
      <span></span>
    </div>

    <!-- Backtest columns -->
    <div id="bt-header" class="bt-header" style="display:none">
      <span class="t-micro">Strategy</span>
      <span class="t-micro" style="text-align:right">Run at</span>
      <span class="t-micro bt-col-sharpe" style="text-align:right">Sharpe</span>
      <span class="t-micro bt-col-dd" style="text-align:right">Max DD</span>
      <span class="t-micro" style="text-align:right">Win %</span>
      <span class="t-micro" style="text-align:right">Return</span>
      <span class="t-micro" style="text-align:right">Trades</span>
      <span class="t-micro" style="text-align:right">Result</span>
      <span></span>
    </div>

    <div id="strat-body">
      <div class="empty">Loading…</div>
    </div>

  </div>
</div>

<div id="nav-mount"></div>
<div class="toast-stack" id="toast-stack"></div>

<script src="/static/dashboard/base.js"></script>
<script>
document.getElementById('topbar-mount').innerHTML = topbar('Strategies');
document.getElementById('nav-mount').innerHTML = capsuleNav('Strategies');
init();

const SERIES_COLORS = ['#EDECE8','#E89B7F','#B59CFF','#C7E27A','#4FE0B6','#6FA8FF','#F0C66B'];
let currentMode = 'live';
let liveTimer = null;
const runningSet = new Set();

// ── Toast ──────────────────────────────────────────────────────────────────────
function toast(msg, type = 'ok') {
  const stack = document.getElementById('toast-stack');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  stack.appendChild(el);
  requestAnimationFrame(() => { requestAnimationFrame(() => el.classList.add('show')); });
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 200);
  }, 4000);
}

// ── Mode toggle ────────────────────────────────────────────────────────────────
document.getElementById('mode-toggle').addEventListener('click', e => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn || btn.getAttribute('aria-selected') === 'true') return;
  document.querySelectorAll('#mode-toggle button').forEach(b => b.removeAttribute('aria-selected'));
  btn.setAttribute('aria-selected', 'true');
  currentMode = btn.dataset.mode;
  const isLive = currentMode === 'live';
  document.getElementById('live-header').style.display = isLive ? '' : 'none';
  document.getElementById('bt-header').style.display   = isLive ? 'none' : '';
  document.getElementById('bt-controls').style.display = isLive ? 'none' : '';
  if (isLive) {
    loadStrategies();
    if (!liveTimer) liveTimer = setInterval(loadStrategies, 30_000);
  } else {
    clearInterval(liveTimer); liveTimer = null;
    loadBacktests();
  }
});

// ── Live tab ───────────────────────────────────────────────────────────────────
async function loadStrategies() {
  const data = await (await fetch('/dashboard/api/strategy/performance')).json();
  const body = document.getElementById('strat-body');
  const sub  = document.getElementById('strat-sub');
  const t    = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });

  sub.textContent = `${data.length} active · updated today, ${t}`;

  if (!data.length) {
    body.innerHTML = `<div style="padding:64px 24px;text-align:center">
      <div class="t-h3" style="margin-bottom:8px">No strategies yet</div>
      <div class="t-small">Strategies appear here once they have closed at least one trade.</div>
    </div>`;
    return;
  }

  body.innerHTML = data.map((s, i) => {
    const pnl     = parseFloat(s.net_pnl);
    const color   = SERIES_COLORS[i % SERIES_COLORS.length];
    const spColor = pnl >= 0 ? 'var(--pos)' : 'var(--neg)';
    const spPts   = genCurve(s.strategy_id.charCodeAt(0) || 7, 60, 100, 0.018, pnl > 0 ? 0.0015 : -0.0008);
    const pf      = s.profit_factor ? parseFloat(s.profit_factor) : null;
    const pfStr   = pf != null ? pf.toFixed(2) : '—';
    const pfColor = pf == null ? 'var(--fg-4)'
                  : pf >= 1.5 ? 'var(--pos)'
                  : pf >= 1.0 ? 'var(--warn)'
                  :             'var(--neg)';

    return `<div class="strat-row">
      <span style="display:inline-block;width:14px;height:2px;background:${color};border-radius:1px;flex-shrink:0"></span>
      <div style="min-width:0">
        <div style="font-family:var(--font-mono);font-size:var(--t-small);font-weight:500">${s.strategy_id}</div>
        <div class="t-xs" style="color:var(--fg-2);margin-top:2px">${s.trade_count} trade${s.trade_count !== 1 ? 's' : ''} closed</div>
      </div>
      <div class="col-spark">${sparkline(spPts, { color: spColor, w: 110, h: 34, sw: 1.5 })}</div>
      <div style="text-align:right;font-family:var(--font-mono);font-size:var(--t-small);color:${pfColor}" class="col-pf">${pfStr}</div>
      <div style="text-align:right">
        <span class="${pnl >= 0 ? 'pill-pos' : 'pill-neg'}">${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}</span>
      </div>
      <div class="col-wr" style="text-align:right;font-family:var(--font-mono);font-size:var(--t-small);color:var(--fg-2)">${fmt.pct(s.win_rate)}</div>
      <div style="text-align:right;font-family:var(--font-mono);font-size:var(--t-small);color:var(--fg-2)">${s.trade_count}</div>
      <div style="text-align:right;color:var(--fg-3)">${icon('arrowUR', 14)}</div>
    </div>`;
  }).join('');
}

// ── Backtest tab ───────────────────────────────────────────────────────────────
function btParams() {
  return {
    bar_size:      document.getElementById('bt-bar-size').value,
    lookback_bars: parseInt(document.getElementById('bt-lookback').value, 10) || 2000,
  };
}

const spinSVG = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 1v2M6 9v2M1 6h2M9 6h2M2.22 2.22l1.41 1.41M8.37 8.37l1.41 1.41M2.22 9.78l1.41-1.41M8.37 3.63l1.41-1.41"/></svg>`;

async function runBacktest(strategyId) {
  if (runningSet.has(strategyId)) return;
  runningSet.add(strategyId);

  const btn = document.getElementById(`run-btn-${CSS.escape(strategyId)}`);
  if (btn) { btn.disabled = true; btn.classList.add('spinning'); btn.innerHTML = spinSVG + ' Running'; }

  try {
    const res = await fetch(`/strategy/${strategyId}/validate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(btParams()),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      toast(`${strategyId}: ${err.detail || res.statusText}`, 'err');
    } else {
      const r = await res.json();
      toast(`${strategyId}: ${r.passed ? '✓ Pass' : '✗ Fail'} · Sharpe ${parseFloat(r.sharpe_ratio).toFixed(2)}`, r.passed ? 'ok' : 'err');
      updateRow(r);
    }
  } catch (e) {
    toast(`${strategyId}: network error`, 'err');
  } finally {
    runningSet.delete(strategyId);
    if (btn) { btn.disabled = false; btn.classList.remove('spinning'); btn.innerHTML = 'Run'; }
  }
}

async function runAllBacktests() {
  const strategies = await (await fetch('/strategy/list')).json();
  const btn = document.getElementById('btn-run-all');
  btn.disabled = true;
  btn.textContent = `Running 0 / ${strategies.length}`;
  let done = 0;
  await Promise.all(strategies.map(async s => {
    await runBacktest(s.strategy_id);
    btn.textContent = `Running ${++done} / ${strategies.length}`;
  }));
  btn.disabled = false;
  btn.textContent = 'Run All';
  toast(`All ${strategies.length} backtests complete`, 'ok');
}

function updateRow(r) {
  const rowEl = document.getElementById(`bt-row-${CSS.escape(r.strategy_id)}`);
  if (!rowEl) { loadBacktests(); return; }
  const ret    = parseFloat(r.total_return_pct);
  const dd     = parseFloat(r.max_drawdown_pct);
  const sharpe = parseFloat(r.sharpe_ratio);
  const wr     = parseFloat(r.win_rate_pct);
  const runAt  = new Date(r.run_at).toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
  rowEl.innerHTML = btRowInner(r, { ret, dd, sharpe, wr, runAt });
}

function btRowInner(r, { ret, dd, sharpe, wr, runAt }) {
  const retColor  = ret >= 0 ? 'var(--pos)' : 'var(--neg)';
  const ddColor   = dd <= 10 ? 'var(--pos)' : dd <= 20 ? 'var(--warn)' : 'var(--neg)';
  const shColor   = sharpe >= 1.5 ? 'var(--pos)' : sharpe >= 0.5 ? 'var(--warn)' : 'var(--neg)';
  const passBadge = r.passed ? `<span class="pill-pos">Pass</span>` : `<span class="pill-neg">Fail</span>`;
  const noResult  = runAt === null;
  return `
    <div style="min-width:0">
      <div style="font-family:var(--font-mono);font-size:var(--t-small);font-weight:500">${r.strategy_id}</div>
      <div class="t-xs" style="color:var(--fg-2);margin-top:2px">${noResult ? '—' : `${r.bar_size} · ${r.num_bars} bars`}</div>
    </div>
    <div style="text-align:right;font-family:var(--font-mono);font-size:var(--t-xs);color:var(--fg-3)">${noResult ? '—' : runAt}</div>
    <div class="bt-col-sharpe" style="text-align:right;font-family:var(--font-mono);font-size:var(--t-small);color:${noResult ? 'var(--fg-4)' : shColor}">${noResult ? '—' : sharpe.toFixed(2)}</div>
    <div class="bt-col-dd" style="text-align:right;font-family:var(--font-mono);font-size:var(--t-small);color:${noResult ? 'var(--fg-4)' : ddColor}">${noResult ? '—' : dd.toFixed(1) + '%'}</div>
    <div style="text-align:right;font-family:var(--font-mono);font-size:var(--t-small);color:${noResult ? 'var(--fg-4)' : 'var(--fg-2)'}">${noResult ? '—' : wr.toFixed(1) + '%'}</div>
    <div style="text-align:right"><span style="font-family:var(--font-mono);font-size:var(--t-small);color:${noResult ? 'var(--fg-4)' : retColor}">${noResult ? '—' : (ret >= 0 ? '+' : '') + ret.toFixed(2) + '%'}</span></div>
    <div style="text-align:right;font-family:var(--font-mono);font-size:var(--t-small);color:var(--fg-2)">${noResult ? '—' : r.num_trades}</div>
    <div style="text-align:right">${noResult ? '' : passBadge}</div>
    <div style="text-align:right"><button class="run-btn" id="run-btn-${r.strategy_id}" onclick="runBacktest('${r.strategy_id}')">Run</button></div>`;
}

async function loadBacktests() {
  const body = document.getElementById('strat-body');
  const sub  = document.getElementById('strat-sub');
  body.innerHTML = `<div class="empty">Loading…</div>`;

  const strategies = await (await fetch('/strategy/list')).json();
  if (!strategies.length) {
    sub.textContent = '0 strategies';
    body.innerHTML = `<div style="padding:64px 24px;text-align:center">
      <div class="t-h3" style="margin-bottom:8px">No strategies registered</div>
    </div>`;
    return;
  }

  const results = await Promise.all(
    strategies.map(s =>
      fetch(`/strategy/${s.strategy_id}/backtest-results?limit=1`)
        .then(r => r.json())
        .then(rows => rows[0] ? { ...rows[0], symbol: s.symbol } : { strategy_id: s.strategy_id, symbol: s.symbol, _noResult: true })
        .catch(() => ({ strategy_id: s.strategy_id, symbol: s.symbol, _noResult: true }))
    )
  );

  const withResults = results.filter(r => !r._noResult).length;
  sub.textContent = `${withResults} of ${strategies.length} strategies have backtest results`;

  body.innerHTML = results.map(r => {
    if (r._noResult) {
      const stub = { strategy_id: r.strategy_id };
      return `<div class="bt-row" id="bt-row-${r.strategy_id}">${btRowInner(stub, { ret: 0, dd: 0, sharpe: 0, wr: 0, runAt: null })}</div>`;
    }
    const ret    = parseFloat(r.total_return_pct);
    const dd     = parseFloat(r.max_drawdown_pct);
    const sharpe = parseFloat(r.sharpe_ratio);
    const wr     = parseFloat(r.win_rate_pct);
    const runAt  = new Date(r.run_at).toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    return `<div class="bt-row" id="bt-row-${r.strategy_id}">${btRowInner(r, { ret, dd, sharpe, wr, runAt })}</div>`;
  }).join('');
}

loadStrategies();
liveTimer = setInterval(loadStrategies, 30_000);
</script>
</body>
</html>
