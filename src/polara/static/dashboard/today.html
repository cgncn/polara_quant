<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polara — Today</title>
  <link rel="stylesheet" href="/static/dashboard/base.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="status-bar-mount"></div>
<div id="nav-mount"></div>

<div class="page">
  <div class="page-header">
    <h1 id="page-date">—</h1>
    <div class="subtitle" id="market-status">Loading…</div>
  </div>

  <div class="cards" id="kpi-cards">
    <div class="card"><div class="label">Net P&L Today</div><div class="value" id="kpi-pnl">—</div></div>
    <div class="card"><div class="label">NAV</div><div class="value neutral" id="kpi-nav">—</div></div>
    <div class="card"><div class="label">Trades</div><div class="value neutral" id="kpi-trades">—</div></div>
    <div class="card"><div class="label">Win Rate</div><div class="value neutral" id="kpi-wr">—</div></div>
    <div class="card"><div class="label">Winners</div><div class="value up" id="kpi-wins">—</div></div>
    <div class="card"><div class="label">Losers</div><div class="value" id="kpi-losses">—</div></div>
  </div>

  <div class="chart-wrap">
    <h2>P&L — Last 30 Days</h2>
    <canvas id="pnl-chart"></canvas>
  </div>

  <div class="table-wrap">
    <div class="table-header">
      <h2>Today's Trades</h2>
      <span id="trade-count" class="dim"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Strategy</th>
          <th>Symbol</th>
          <th>Side</th>
          <th>Qty</th>
          <th>Entry</th>
          <th>Exit</th>
          <th>P&L</th>
          <th>Entry Time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="trades-body">
        <tr><td colspan="9" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="/static/dashboard/base.js"></script>
<script>
document.getElementById('status-bar-mount').innerHTML = statusBar();
document.getElementById('nav-mount').innerHTML = nav('Today');
init();

async function loadToday() {
  const d = await (await fetch('/dashboard/api/summary/today')).json();

  document.getElementById('page-date').textContent =
    new Date(d.date).toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  const pnl = parseFloat(d.net_pnl);
  const pnlEl = document.getElementById('kpi-pnl');
  pnlEl.textContent = fmt.pnl(d.net_pnl);
  pnlEl.className = 'value ' + pnlClass(d.net_pnl);

  document.getElementById('kpi-nav').textContent = d.end_nav ? parseFloat(d.end_nav).toFixed(0) : '—';
  document.getElementById('kpi-trades').textContent = d.trade_count;
  document.getElementById('kpi-wr').textContent = fmt.pct(d.win_rate);
  document.getElementById('kpi-wins').textContent = d.win_count;
  const losses = d.trade_count - d.win_count;
  const lossEl = document.getElementById('kpi-losses');
  lossEl.textContent = losses;
  lossEl.className = 'value ' + (losses > 0 ? 'down' : 'neutral');

  document.getElementById('trade-count').textContent = `${d.trade_count} trade${d.trade_count !== 1 ? 's' : ''}`;

  const tbody = document.getElementById('trades-body');
  if (!d.trades.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">No trades today</td></tr>';
    return;
  }
  tbody.innerHTML = d.trades.map(t => {
    const hasPnl = t.realised_pnl !== null && t.realised_pnl !== undefined;
    return `
    <tr>
      <td class="dim">${t.strategy_id}</td>
      <td><strong>${t.symbol}</strong></td>
      <td><span class="badge ${t.side}">${t.side.toUpperCase()}</span></td>
      <td>${fmt.price(t.quantity)}</td>
      <td>${fmt.price(t.entry_price)}</td>
      <td>${fmt.price(t.exit_price)}</td>
      <td class="${hasPnl ? pnlClass(t.realised_pnl) : 'dim'}">${hasPnl ? fmt.pnl(t.realised_pnl) : '—'}</td>
      <td class="dim">${fmt.time(t.entry_at)}</td>
      <td><span class="badge ${t.status}">${t.status}</span></td>
    </tr>`;
  }).join('');
}

async function loadChart() {
  const hist = await (await fetch('/dashboard/api/pnl/history?days=30')).json();
  if (!hist.length) return;
  const sorted = [...hist].reverse();
  const labels = sorted.map(d => d.date.slice(5));
  const data = sorted.map(d => parseFloat(d.net_pnl));
  const colors = data.map(v => v >= 0 ? 'rgba(34,197,94,0.8)' : 'rgba(239,68,68,0.8)');

  new Chart(document.getElementById('pnl-chart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: colors,
        borderRadius: 3,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: '#1e1e30' }, ticks: { color: '#64748b', font: { family: 'monospace', size: 10 } } },
        y: { grid: { color: '#1e1e30' }, ticks: { color: '#64748b', font: { family: 'monospace', size: 10 } } },
      }
    }
  });
}

loadToday();
loadChart();
setInterval(loadToday, 30_000);
</script>
</body>
</html>
