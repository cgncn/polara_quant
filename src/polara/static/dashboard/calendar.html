<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polara — Calendar</title>
  <link rel="stylesheet" href="/static/dashboard/base.css">
  <style>
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .cal-month-title {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .cal-month-title span { color: var(--fg-2); }
    .cal-controls { display: flex; align-items: center; gap: 10px; }

    .cal-grid-wrap {
      background: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: var(--r6);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .cal-dow-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--line);
    }
    .cal-dow {
      padding: 10px 12px;
      font-size: 10px;
      font-weight: 500;
      color: var(--fg-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .cal-cells {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .cal-cell {
      min-height: 80px;
      padding: 10px 12px;
      border-right: 1px solid var(--line-xs);
      border-bottom: 1px solid var(--line-xs);
      cursor: pointer;
      transition: background var(--fast) var(--ease);
      position: relative;
    }
    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-cell.empty        { cursor: default; }
    .cal-cell.today        { background: var(--surface-2); }
    .cal-cell.selected     { background: rgba(255,255,255,0.03); }
    .cal-cell:hover        { background: rgba(255,255,255,0.03); }
    .cal-cell.profit       { background: rgba(63,182,139,0.06); }
    .cal-cell.loss         { background: rgba(229,72,77,0.06); }
    .cal-cell.profit:hover { background: rgba(63,182,139,0.10); }
    .cal-cell.loss:hover   { background: rgba(229,72,77,0.10); }

    .cal-day-num {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg-3);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cal-cell.today .cal-day-num { color: var(--accent); font-weight: 600; }

    .cal-pnl {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .cal-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--fg-3);
      margin-top: 3px;
    }

    /* detail panel */
    .detail-panel {
      background: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: var(--r6);
      overflow: hidden;
    }
  </style>
</head>
<body>
<div id="topbar-mount"></div>

<div class="page">
  <div class="cal-header">
    <div id="cal-month-label" class="cal-month-title">—</div>
    <div class="cal-controls">
      <div class="segmented" id="view-seg">
        <button class="active">Month</button>
        <button>Week</button>
      </div>
      <button class="btn" onclick="prevMonth()">← Prev</button>
      <button class="btn" onclick="nextMonth()">Next →</button>
    </div>
  </div>

  <div class="cal-grid-wrap">
    <div class="cal-dow-row" id="cal-dow"></div>
    <div class="cal-cells" id="cal-cells"></div>
  </div>

  <div class="detail-panel" id="day-detail" style="display:none">
    <div class="table-header">
      <h2 id="detail-date">—</h2>
      <span style="font-size:11px;color:var(--fg-3)" id="detail-stats"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Strategy</th>
          <th>Symbol</th>
          <th>Side</th>
          <th style="text-align:right">Entry</th>
          <th style="text-align:right">Exit</th>
          <th style="text-align:right">P&amp;L</th>
          <th style="text-align:right">Time</th>
        </tr>
      </thead>
      <tbody id="detail-body"></tbody>
    </table>
  </div>
</div>

<div id="nav-mount"></div>

<script src="/static/dashboard/base.js"></script>
<script>
document.getElementById('topbar-mount').innerHTML = topbar('Calendar');
document.getElementById('nav-mount').innerHTML = capsuleNav('Calendar');
init();

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let currentYear, currentMonth;
let historyMap = {};

// Populate day-of-week header
document.getElementById('cal-dow').innerHTML =
  DAYS.map(d => `<div class="cal-dow">${d}</div>`).join('');

async function loadHistory() {
  const data = await (await fetch('/dashboard/api/pnl/history?days=365')).json();
  historyMap = {};
  data.forEach(d => { historyMap[d.date] = d; });
}

function renderCalendar() {
  const now = new Date(currentYear, currentMonth);
  const monthName = now.toLocaleDateString('en-US', { month: 'long' });
  document.getElementById('cal-month-label').innerHTML =
    `${monthName} <span>${currentYear}</span>`;

  const firstDay   = new Date(currentYear, currentMonth, 1);
  const startOff   = (firstDay.getDay() + 6) % 7; // Mon=0
  const daysInMo   = new Date(currentYear, currentMonth + 1, 0).getDate();
  const todayStr   = new Date().toISOString().slice(0, 10);

  let html = '';
  for (let i = 0; i < startOff; i++) html += `<div class="cal-cell empty"></div>`;

  for (let day = 1; day <= daysInMo; day++) {
    const mm  = String(currentMonth + 1).padStart(2, '0');
    const dd  = String(day).padStart(2, '0');
    const dateStr = `${currentYear}-${mm}-${dd}`;
    const d   = historyMap[dateStr];
    const pnl = d ? parseFloat(d.net_pnl) : null;
    const isToday = dateStr === todayStr;

    const cls = ['cal-cell',
      isToday ? 'today' : '',
      d && pnl > 0 ? 'profit' : '',
      d && pnl < 0 ? 'loss'   : '',
    ].filter(Boolean).join(' ');

    const todayDot = isToday
      ? `<span style="width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block"></span>`
      : '';

    html += `<div class="${cls}" onclick="selectDay('${dateStr}',this)">
      <div class="cal-day-num">${day}${todayDot}</div>
      ${d ? `
        <div class="cal-pnl ${pnlClass(pnl)}">${fmt.pnl(pnl)}</div>
        <div class="cal-meta">${d.trade_count}t · ${fmt.pct(d.win_rate)} wr</div>
      ` : ''}
    </div>`;
  }
  document.getElementById('cal-cells').innerHTML = html;
}

async function selectDay(dateStr, cellEl) {
  document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
  cellEl?.classList.add('selected');

  const trades = await (await fetch(`/dashboard/api/trades?date=${dateStr}`)).json();
  const d = historyMap[dateStr];

  document.getElementById('detail-date').textContent = dateStr;
  document.getElementById('detail-stats').textContent = d
    ? `${fmt.pnl(d.net_pnl)} · ${d.trade_count} trade${d.trade_count !== 1 ? 's' : ''} · ${fmt.pct(d.win_rate)} win rate`
    : 'No P&L data';

  const tbody = document.getElementById('detail-body');
  if (!trades.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">No trades this day</td></tr>';
  } else {
    tbody.innerHTML = trades.map(t => {
      const hasPnl = t.realised_pnl != null;
      return `<tr>
        <td style="color:var(--fg-3);font-size:11px">${t.strategy_id}</td>
        <td>
          <span style="display:inline-flex;align-items:center;gap:6px">
            ${tickerGlyph(t.symbol, 18)}
            <strong style="font-family:var(--mono)">${t.symbol}</strong>
          </span>
        </td>
        <td><span class="pill ${t.side === 'buy' ? 'pill-pos' : 'pill-neg'}">${t.side.toUpperCase()}</span></td>
        <td style="text-align:right">${fmt.price(t.entry_price)}</td>
        <td style="text-align:right">${fmt.price(t.exit_price)}</td>
        <td style="text-align:right">
          ${hasPnl
            ? `<span class="pill pill-${pnlClass(t.realised_pnl)}">${fmt.pnl(t.realised_pnl)}</span>`
            : `<span class="pill pill-neu">open</span>`}
        </td>
        <td style="text-align:right;color:var(--fg-3)">${fmt.time(t.entry_at)}</td>
      </tr>`;
    }).join('');
  }
  document.getElementById('day-detail').style.display = 'block';
}

function prevMonth() {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderCalendar();
}
function nextMonth() {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderCalendar();
}

async function main() {
  const now = new Date();
  currentYear  = now.getFullYear();
  currentMonth = now.getMonth();
  await loadHistory();
  renderCalendar();
}
main();
</script>
</body>
</html>
