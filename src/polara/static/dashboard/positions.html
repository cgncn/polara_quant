<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polara — Positions</title>
  <link rel="stylesheet" href="/static/dashboard/base.css">
  <style>
    .kpi-strip-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: var(--r6);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .kpi-strip-4 .kp {
      padding: 16px 18px;
      border-right: 1px solid var(--line);
    }
    .kpi-strip-4 .kp:last-child { border-right: none; }
    .kpi-strip-4 .kp .lbl {
      font-size: 10px;
      color: var(--fg-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .kpi-strip-4 .kp .val {
      font-family: var(--mono);
      font-size: 22px;
      letter-spacing: -0.02em;
    }

    .pulse-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--pos);
      box-shadow: 0 0 6px var(--pos);
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .exposure-bar {
      height: 3px;
      background: var(--line);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }
    .exposure-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s var(--ease);
    }

    @media (max-width: 700px) {
      .kpi-strip-4 { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div id="topbar-mount"></div>

<div class="page">

  <!-- KPI strip -->
  <div class="kpi-strip-4">
    <div class="kp">
      <div class="lbl">Open positions</div>
      <div class="val" id="kpi-count">—</div>
    </div>
    <div class="kp">
      <div class="lbl">Unrealised P&amp;L</div>
      <div class="val" id="kpi-upnl">—</div>
    </div>
    <div class="kp">
      <div class="lbl">Long exposure</div>
      <div class="val" id="kpi-long">—</div>
      <div class="exposure-bar"><div class="exposure-fill" id="long-bar" style="background:var(--pos);width:0%"></div></div>
    </div>
    <div class="kp">
      <div class="lbl">Short exposure</div>
      <div class="val" id="kpi-short">—</div>
      <div class="exposure-bar"><div class="exposure-fill" id="short-bar" style="background:var(--neg);width:0%"></div></div>
    </div>
  </div>

  <!-- Open positions table -->
  <div class="card" style="overflow:hidden;margin-bottom:14px">
    <div class="table-header">
      <span class="pulse-dot" id="live-dot" style="display:none"></span>
      <h2>Open positions</h2>
      <span style="font-size:11px;color:var(--fg-3)" id="pos-subtitle">Refreshes every 10 s</span>
      <span style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--fg-4)" id="last-updated"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Strategy</th>
          <th>Side</th>
          <th style="text-align:right">Qty</th>
          <th style="text-align:right">Entry</th>
          <th style="text-align:right">Last</th>
          <th style="text-align:right">Unreal P&amp;L</th>
          <th style="text-align:right">Entry time</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="pos-body">
        <tr><td colspan="9" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- All open trades (entry pending exit) -->
  <div class="card" style="overflow:hidden">
    <div class="table-header">
      <h2>Pending close</h2>
      <span style="font-size:11px;color:var(--fg-3)" id="pending-count"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Strategy</th>
          <th>Side</th>
          <th style="text-align:right">Qty</th>
          <th style="text-align:right">Entry price</th>
          <th style="text-align:right">Entry time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="pending-body">
        <tr><td colspan="7" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<div id="nav-mount"></div>

<script src="/static/dashboard/base.js"></script>
<script>
document.getElementById('topbar-mount').innerHTML = topbar('Positions');
document.getElementById('nav-mount').innerHTML = capsuleNav('Positions');
init();

async function loadPositions() {
  const trades = await (await fetch('/dashboard/api/trades?limit=500')).json();
  const open   = trades.filter(t => t.status === 'open');

  // Live pulse dot
  const dot = document.getElementById('live-dot');
  dot.style.display = open.length ? 'inline-block' : 'none';

  // KPI values
  let totalUpnl = 0, longExp = 0, shortExp = 0;
  open.forEach(t => {
    const upnl = t.unrealised_pnl != null ? parseFloat(t.unrealised_pnl) : 0;
    totalUpnl += upnl;
    const notional = parseFloat(t.quantity || 0) * parseFloat(t.entry_price || 0);
    if (t.side === 'buy') longExp  += notional;
    else                  shortExp += notional;
  });
  const totalExp = longExp + shortExp || 1;

  document.getElementById('kpi-count').textContent = open.length;

  const upnlEl = document.getElementById('kpi-upnl');
  upnlEl.textContent = open.length ? fmt.pnl(totalUpnl) : '—';
  upnlEl.className   = 'val ' + (open.length ? pnlClass(totalUpnl) : '');

  document.getElementById('kpi-long').textContent  = longExp  ? fmt.compact(longExp)  : '—';
  document.getElementById('kpi-short').textContent = shortExp ? fmt.compact(shortExp) : '—';
  document.getElementById('long-bar').style.width  = ((longExp  / totalExp) * 100).toFixed(1) + '%';
  document.getElementById('short-bar').style.width = ((shortExp / totalExp) * 100).toFixed(1) + '%';

  // Positions table
  const posBody = document.getElementById('pos-body');
  if (!open.length) {
    posBody.innerHTML = '<tr><td colspan="9" class="empty">No open positions</td></tr>';
  } else {
    posBody.innerHTML = open.map(t => {
      const upnl    = t.unrealised_pnl != null ? parseFloat(t.unrealised_pnl) : null;
      return `<tr>
        <td>
          <span style="display:inline-flex;align-items:center;gap:8px">
            ${tickerGlyph(t.symbol, 20)}
            <strong style="font-family:var(--mono)">${t.symbol}</strong>
          </span>
        </td>
        <td style="color:var(--fg-3);font-size:11px">${t.strategy_id}</td>
        <td><span class="pill ${t.side === 'buy' ? 'pill-pos' : 'pill-neg'}">${t.side.toUpperCase()}</span></td>
        <td style="text-align:right;font-family:var(--mono);color:var(--fg-2)">${fmt.price(t.quantity)}</td>
        <td style="text-align:right;font-family:var(--mono)">${fmt.price(t.entry_price)}</td>
        <td style="text-align:right;font-family:var(--mono);color:var(--fg-3)">—</td>
        <td style="text-align:right">
          ${upnl != null
            ? `<span class="pill pill-${pnlClass(upnl)}">${fmt.pnl(upnl)}</span>`
            : `<span style="color:var(--fg-4);font-size:11px">—</span>`}
        </td>
        <td style="text-align:right;font-family:var(--mono);color:var(--fg-3)">${fmt.time(t.entry_at)}</td>
        <td style="text-align:right;color:var(--fg-4)">${icon('arrowUR', 12)}</td>
      </tr>`;
    }).join('');
  }

  // Pending close (same as open, cleaner view)
  const pendBody = document.getElementById('pending-body');
  document.getElementById('pending-count').textContent =
    `${open.length} trade${open.length !== 1 ? 's' : ''} awaiting exit`;
  if (!open.length) {
    pendBody.innerHTML = '<tr><td colspan="7" class="empty">No open trades</td></tr>';
  } else {
    pendBody.innerHTML = open.map(t => `<tr>
      <td>
        <span style="display:inline-flex;align-items:center;gap:8px">
          ${tickerGlyph(t.symbol, 18)}
          <strong style="font-family:var(--mono)">${t.symbol}</strong>
        </span>
      </td>
      <td style="color:var(--fg-3);font-size:11px">${t.strategy_id}</td>
      <td><span class="pill ${t.side === 'buy' ? 'pill-pos' : 'pill-neg'}">${t.side.toUpperCase()}</span></td>
      <td style="text-align:right;font-family:var(--mono);color:var(--fg-2)">${fmt.price(t.quantity)}</td>
      <td style="text-align:right;font-family:var(--mono)">${fmt.price(t.entry_price)}</td>
      <td style="text-align:right;font-family:var(--mono);color:var(--fg-3)">${fmt.time(t.entry_at)}</td>
      <td><span class="pill pill-neu">OPEN</span></td>
    </tr>`).join('');
  }

  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toUTCString().slice(17, 25) + ' UTC';
}

loadPositions();
setInterval(loadPositions, 10_000);
</script>
</body>
</html>
